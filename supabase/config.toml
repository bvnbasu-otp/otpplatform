# OTP local Supabase configuration
# See https://supabase.com/docs/guides/cli/config

project_id = "otp-local"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

# ⚠️  LOCAL DEVELOPMENT ONLY.
# Every path below seeds demo data (test users with the shared password
# "password", walkthrough scenarios, mock suppliers). Do NOT apply against a
# production project — `supabase db reset --linked` would create demo accounts
# that let anyone sign in. Production deployments run migrations only; see
# docs/DEPLOYMENT.md.
[db.seed]
enabled = true
sql_paths = ["./seed.sql", "./seed_pilots_horizontals.sql", "./seed_market_intelligence.sql", "./seed_procurement_policies.sql", "./seed_taxonomy_alignment.sql", "./seed_demo_environment.sql", "./seed_demo_messaging.sql", "./seed_demo_roles.sql", "./seed_demo_test_accounts.sql", "./seed_master_role_accounts.sql"]

[studio]
enabled = false
port = 54323
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 54324
smtp_port = 54325
pop3_port = 54326

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "https://otpplatform-theta.vercel.app"
additional_redirect_urls = [
  "http://127.0.0.1:3000",
  "http://127.0.0.1:3000/**",
  "http://localhost:3000",
  "http://localhost:3000/**",
  "http://localhost:5173",
  "http://localhost:5173/**",
  "http://opentradeprocurement.ai:3000",
  "https://otpplatform-theta.vercel.app",
  "https://otpplatform-theta.vercel.app/**",
  "https://otpplatform-theta.vercel.app/auth/callback",
  "https://otpplatform-theta.vercel.app/reset-password",
  "https://otpplatform-theta.vercel.app/q/**",
  "https://otpplatform.vercel.app",
  "https://otpplatform.vercel.app/**",
  "https://*.vercel.app",
  "https://*.vercel.app/**"
]
jwt_expiry = 3600
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
double_confirm_changes = true
# In production, enable_confirmations must be true.
enable_confirmations = false

[auth.email.smtp]
host = "smtp.gmail.com"
port = 587
user = "env(SMTP_USER)"
pass = "env(SMTP_PASS)"
admin_email = "env(SMTP_ADMIN_EMAIL)"
sender_name = "OTP Platform"

[auth.email.template.magic_link]
subject = "Your OTP Sign-In Code"
content_path = "./supabase/templates/magic_link.html"

[auth.email.template.recovery]
subject = "Reset Your Password - OTP Platform"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.invite]
subject = "Your OTP Platform Account has been Approved"
content_path = "./supabase/templates/invite.html"

[edge_runtime]
enabled = false
policy = "oneshot"
inspector_port = 8083

[analytics]
enabled = false
