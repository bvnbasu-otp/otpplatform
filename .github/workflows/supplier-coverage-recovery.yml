name: Supplier Coverage Recovery Worker

# Drives durable PIN/category coverage recovery (migration 00274). The edge
# function claims each due scope through location_pin_coverage_try_acquire_generation,
# so overlapping runs cannot process the same scope twice.
#
# Prerequisites (hosted, not changed by this file):
#   * repository secrets SUPABASE_SERVICE_ROLE_KEY and VITE_SUPABASE_URL (or SUPABASE_URL)
#   * the location-pin-coverage edge function deployed with migration 00274 applied
# GitHub-hosted schedules can be delayed by several minutes and are paused after
# 60 days without repository activity; the admin recovery screen remains the
# manual fallback.

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: supplier-coverage-recovery
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run-due-retries:
    name: Process due coverage retries
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Invoke recovery worker
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL}" ] || [ -z "${SUPABASE_SERVICE_ROLE_KEY}" ]; then
            echo "::error::SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY repository secrets are required"
            exit 1
          fi
          status=$(curl --silent --show-error --max-time 300 \
            --output response.json --write-out '%{http_code}' \
            --request POST "${SUPABASE_URL%/}/functions/v1/location-pin-coverage" \
            --header "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            --header 'Content-Type: application/json' \
            --data '{"mode":"run_due_retries","limit":5}')
          echo "location-pin-coverage run_due_retries HTTP ${status}"
          if [ "${status}" -lt 200 ] || [ "${status}" -ge 300 ]; then
            echo "::error::Recovery worker request failed with HTTP ${status}"
            exit 1
          fi
          node -e "const r=require('./response.json'); console.log('processed:', r.processed); const failed=(r.results||[]).filter(x=>x.ok===false); if (failed.length) { console.log('failed scopes:', failed.length); }"
