<svg width="600" height="340" viewBox="0 0 600 340" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Modern Gradient for Blue X and O -->
    <linearGradient id="modern-blue-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Modern Gradient for Orange 2 -->
    <linearGradient id="modern-orange-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A1A" />
      <stop offset="100%" stop-color="#FF5500" />
    </linearGradient>
  </defs>

  <rect width="600" height="340" fill="#050B14" rx="16" />

  <!-- MAIN LOGOMARK GROUP: Centered at X=300.0 -->
  <g transform="translate(46.5, 0)">
    
    <!-- THE 'X': Size 120x120 (X: 90..210, Y: 70..190), Modern Royal Blue -->
    <g id="letter-x">
      <line x1="90" y1="70" x2="210" y2="190" stroke="url(#modern-blue-dark)" stroke-width="26" stroke-linecap="round" />
      <line x1="90" y1="190" x2="210" y2="70" stroke="url(#modern-blue-dark)" stroke-width="26" stroke-linecap="round" />
    </g>

    <!-- THE '2': Orange Connector - Welds into X, Arrow physically touches O -->
    <g id="connector-2">
      <!-- Arched body of 2 -->
      <path d="M 200 70 
               C 212 42, 246 36, 276 40 
               C 312 46, 328 72, 316 104 
               C 302 136, 250 162, 215 175 
               L 302 175" 
            stroke="url(#modern-orange-dark)" 
            stroke-width="26" 
            stroke-linecap="round" 
            stroke-linejoin="round" 
            fill="none" />

      <!-- Arrowhead: Tip at (330.5, 175) TOUCHES 'O' left perimeter with 0px gap -->
      <path d="M 295 153 L 331 175 L 295 197 Z" 
            fill="url(#modern-orange-dark)" />
    </g>

    <!-- THE 'O': Size 120x120 (cx=370, cy=130, r_outer=60, Y: 70..190), SAME COLOR as X -->
    <g id="letter-o">
      <!-- Center radius 47 with stroke-width 26 => outer radius 60, outer diameter 120 (exact same as X!) -->
      <circle cx="370" cy="130" r="47" stroke="url(#modern-blue-dark)" stroke-width="26" />
    </g>
  </g>

  <!-- TAGLINE: "Anything to Order" (Strictly Centered horizontally at X=300) -->
  <text x="300" y="272" 
        font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Plus Jakarta Sans', sans-serif" 
        font-size="28" 
        font-weight="600" 
        fill="#E2E8F0" 
        text-anchor="middle" 
        letter-spacing="0.04em">
    Anything to Order
  </text>
</svg>