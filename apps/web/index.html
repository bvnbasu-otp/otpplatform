<html lang="en" class="overflow-x-hidden max-w-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="description" content="Compare competing supplier quotes and make better procurement decisions." />
    <meta property="og:site_name" content="OTP — Open Trade &amp; Procurement" />
    <meta property="og:title" content="OTP — Identity-Protected Competitive Sourcing" />
    <meta property="og:description" content="Compare competing supplier quotes and make better procurement decisions." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="OTP — Identity-Protected Competitive Sourcing" />
    <meta name="twitter:description" content="Compare competing supplier quotes and make better procurement decisions." />
    <title>OTP — Identity-Protected Competitive Sourcing</title>
    <!-- Indian Regional Typography & Fonts (Ensures pristine rendering on all laptops and mobiles) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Bengali:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Noto+Sans+Kannada:wght@400;500;600;700&family=Noto+Sans+Malayalam:wght@400;500;600;700&family=Noto+Sans+Tamil:wght@400;500;600;700&family=Noto+Sans+Telugu:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      .goog-te-banner-frame.skiptranslate,
      .goog-te-banner-frame,
      #goog-gt-tt,
      .goog-te-balloon-frame {
        display: none !important;
        visibility: hidden !important;
      }
      body {
        top: 0px !important;
        position: static !important;
      }
      .goog-text-highlight {
        background: transparent !important;
        box-shadow: none !important;
      }
    </style>
    <script>
      (function () {
        try {
          var storedTheme = localStorage.getItem('otp-theme') || 'system';
          var storedPersona = localStorage.getItem('otp-persona') || 'buyer';
          var storedColorTheme = localStorage.getItem('otp-color-theme');
          var root = document.documentElement;

          root.setAttribute('data-persona', storedPersona);
          if (storedColorTheme && storedColorTheme !== 'auto') {
            root.setAttribute('data-color-theme', storedColorTheme);
          } else {
            root.removeAttribute('data-color-theme');
          }

          if (
            storedTheme === 'dark' ||
            (storedTheme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          ) {
            root.classList.add('dark');
            root.style.colorScheme = 'dark';
          } else {
            root.classList.remove('dark');
            root.style.colorScheme = 'light';
          }
        } catch (e) {
          /* Fallback on localStorage security restrictions */
        }
      })();
    </script>
  </head>
  <body class="overflow-x-hidden max-w-full">
    <div id="google_translate_element" style="display:none;position:absolute;visibility:hidden;"></div>
    <div id="root" class="overflow-x-hidden max-w-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
